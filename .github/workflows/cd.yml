name: CD (changes services only)

on:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  DOCKER_IMAGE_AUTH: ${{ secrets.DOCKER_IMAGE_AUTH }}
  DOCKER_IMAGE_USER: ${{ secrets.DOCKER_IMAGE_USER }}
  DOCKER_IMAGE_MENU: ${{ secrets.DOCKER_IMAGE_MENU }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/chekout@v4

      - name: Setting Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push
