name: CD (changes services only)

on:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  DOCKER_IMAGE_AUTH: ${{ secrets.DOCKER_IMAGE_AUTH }}
  DOCKER_IMAGE_USER: ${{ secrets.DOCKER_IMAGE_USER }}
  DOCKER_IMAGE_MENU: ${{ secrets.DOCKER_IMAGE_MENU }}

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      auth: ${{ steps.filter.outputs.auth }}
      user: ${{ steps.filter.outputs.user }}
      menu: ${{ steps.filter.outputs.menu }}
      shared: ${{ steps.filter.outputs.shared }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect Changed Paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          base: ${{ github.event.before }}
          ref: ${{ github.sha }}
          filters: |
            shared:
              - '.github/workflows/**'
              - 'backend/docker-compose*.yml'
            auth:
              - 'backend/auth/**'
            user:
              - 'backend/user/**'
            menu:
              - 'backend/menu/**'

      - name: Print Changes ( for debugging )
        run: |
          echo "Auth changes: ${{ steps.filter.outputs.auth }}"
          echo "User changes: ${{ steps.filter.outputs.user }}"
          echo "Menu changes: ${{ steps.filter.outputs.menu }}"
          echo "Shared changes: ${{ steps.filter.outputs.shared }}"

  build-and-push-auth:
    needs: detect-changes
    if: needs.detect-changes.outputs.auth == 'true' || needs.detect-changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setting Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: ./backend/auth
          file: ./backend/auth/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.DOCKER_IMAGE_AUTH }}:${{ github.sha }}
            ${{ env.DOCKER_IMAGE_AUTH }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-and-push-user:
    needs: detect-changes
    if: needs.detect-changes.outputs.user == 'true' || needs.detect-changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setting Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: ./backend/user
          file: ./backend/user/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.DOCKER_IMAGE_USER }}:${{ github.sha }}
            ${{ env.DOCKER_IMAGE_USER }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-and-push-menu:
    needs: detect-changes
    if: needs.detect-changes.outputs.menu == 'true' || needs.detect-changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setting Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: ./backend/menu
          file: ./backend/menu/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.DOCKER_IMAGE_MENU }}:${{ github.sha }}
            ${{ env.DOCKER_IMAGE_MENU }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs:
      - detect-changes
      - build-and-push-auth
      - build-and-push-user
      - build-and-push-menu
    if: always()
    runs-on: self-hosted
    steps:
      - name: Update repo on server
        run: |
          set -euo pipefail
          cd ~/omechu-server
          git fetch origin main
          git reset --hard origin/main
          echo "Repository updated on server."

      - name: Create env files on server
        run: |
          set -euo pipefail
          cd ~/omechu-server/backend

          printf "%s\n" "${{ secrets.ENV_PROD }}" > .env.prod
          echo "DOCKER_IMAGE_AUTH=${{ env.DOCKER_IMAGE_AUTH }}" >> .env.prod
          echo "DOCKER_IMAGE_USER=${{ env.DOCKER_IMAGE_USER }}" >> .env.prod
          echo "DOCKER_IMAGE_MENU=${{ env.DOCKER_IMAGE_MENU }}" >> .env.prod

          # 서비스별 env_file (compose에 env_file 유지할 때)
          mkdir -p auth user menu
          printf "%s\n" "${{ secrets.AUTH_ENV_PROD }}" > auth/.env.production
          printf "%s\n" "${{ secrets.USER_ENV_PROD }}" > user/.env.production
          printf "%s\n" "${{ secrets.MENU_ENV_PROD }}" > menu/.env.production

      - name: Rolling deploy only changed services
        env:
          CHANGED_AUTH: ${{ needs.detect-changes.outputs.auth }}
          CHANGED_USER: ${{ needs.detect-changes.outputs.user }}
          CHANGED_MENU: ${{ needs.detect-changes.outputs.menu }}
          CHANGED_SHARED: ${{ needs.detect-changes.outputs.shared }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          cd ~/omechu-server/backend
          COMPOSE="docker compose --env-file .env.prod -f docker-compose.yaml"

          set_tag () {
            local key="$1"
            local val="$2"
            if grep -q "^${key}=" .env.prod; then
              sed -i "s/^${key}=.*/${key}=${val}/" .env.prod
            else
              echo "${key}=${val}" >> .env.prod
            fi
          }

          if [ "$CHANGED_SHARED" = "true" ]; then
            set_tag AUTH_TAG "$SHA"
            set_tag USER_TAG "$SHA"
            set_tag MENU_TAG "$SHA"
          else
            [ "$CHANGED_AUTH" = "true" ] && set_tag AUTH_TAG "$SHA"
            [ "$CHANGED_USER" = "true" ] && set_tag USER_TAG "$SHA"
            [ "$CHANGED_MENU" = "true" ] && set_tag MENU_TAG "$SHA"
          fi

          if [ "$CHANGED_AUTH" = "true" ] || [ "$CHANGED_SHARED" = "true" ]; then
            echo "Deploying auth_api..."
            $COMPOSE pull auth_api
            $COMPOSE up -d --no-deps --force-recreate auth_api
          fi

          if [ "$CHANGED_USER" = "true" ] || [ "$CHANGED_SHARED" = "true" ]; then
            echo "Deploying user_api..."
            $COMPOSE pull user_api
            $COMPOSE up -d --no-deps --force-recreate user_api
          fi

          if [ "$CHANGED_MENU" = "true" ] || [ "$CHANGED_SHARED" = "true" ]; then
            echo "Deploying menu_api..."
            $COMPOSE pull menu_api
            $COMPOSE up -d --no-deps --force-recreate menu_api
          fi

          echo "Deployment completed for changed services."
          docker image prune -f || true
