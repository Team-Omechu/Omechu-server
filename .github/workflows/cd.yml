name: CD (changes services only)

on:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  DOCKER_IMAGE_AUTH: ${{ secrets.DOCKER_IMAGE_AUTH }}
  DOCKER_IMAGE_USER: ${{ secrets.DOCKER_IMAGE_USER }}
  DOCKER_IMAGE_MENU: ${{ secrets.DOCKER_IMAGE_MENU }}

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      auth: ${{ steps.filter.outputs.auth }}
      user: ${{ steps.filter.outputs.user }}
      menu: ${{ steps.filter.outputs.menu }}
      shared: ${{ steps.filter.outputs.shared }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect Changed Paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          base: ${{ github.event.before }}
          ref: ${{ github.sha }}
          filters: |
            shared:
              - '.github/workflows/**'
              - 'backend/docker-compose*.yml'
            auth:
              - 'backend/auth/**'
            user:
              - 'backend/user/**'
            menu:
              - 'backend/menu/**'

      - name: Print Changes ( for debugging )
        run: |
          echo "Auth changes: ${{ steps.filter.outputs.auth }}"
          echo "User changes: ${{ steps.filter.outputs.user }}"
          echo "Menu changes: ${{ steps.filter.outputs.menu }}"
          echo "Shared changes: ${{ steps.filter.outputs.shared }}"

  build-and-push-auth:
    needs: detect-changes
    if: needs.detect-changes.outputs.auth == 'true' || needs.detect-changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setting Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: ./backend/auth
          file: ./backend/auth/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE_AUTH }}:${{ github.sha }}
            ${{ env.DOCKER_IMAGE_AUTH }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-and-push-user:
    needs: detect-changes
    if: needs.detect-changes.outputs.user == 'true' || needs.detect-changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setting Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: ./backend/user
          file: ./backend/user/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE_USER }}:${{ github.sha }}
            ${{ env.DOCKER_IMAGE_USER }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-and-push-menu:
    needs: detect-changes
    if: needs.detect-changes.outputs.menu == 'true' || needs.detect-changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setting Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: ./backend/menu
          file: ./backend/menu/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE_MENU }}:${{ github.sha }}
            ${{ env.DOCKER_IMAGE_MENU }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
