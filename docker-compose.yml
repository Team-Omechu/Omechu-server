version: '3.8'

services:
  backend:
    image: node:18-alpine
    container_name: omechu-backend-dev
    working_dir: /app
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
    command: sh -c "npm install && npx prisma generate && npm run dev"
    restart: unless-stopped
