version: '3.8'

services:
  backend:
    image: node:18-alpine
    container_name: omechu-backend
    working_dir: /app
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
    command: sh -c "npm ci --only=production && npx prisma generate && npm start"
    restart: always
